services:
  api:
    build:
      context: .
      target: development
    ports:
      - "3000:3000"
    environment:
      MONGO_URI: mongodb://mongo:27017/todos
    volumes:
      - ./src:/app/src
    command: npx nodemon -L src/index.js
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data: